[project]
name = "synthprovenance"
version = "2.1.0"
description = "SynthProvenance: Scientific AI Content Signal & Image Provenance Laboratory"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "NuRichter Workspace / Insyide Innovations" }]
dependencies = [
  "PySide6-Essentials==6.10.2", "shiboken6==6.10.2", "pillow==12.0.0", "numpy==2.3.5",
  "blake3==1.0.8", "reportlab==4.4.4", "charset-normalizer==3.5.1",
]

[project.scripts]
synthprovenance = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:PyInstaller.*"]
