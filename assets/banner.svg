<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Something is coming. Big. Still cooking. NuRichter Workspace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#58a6ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="aura" cx="450" cy="230" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="big" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#ff7b72"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="300 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bc8cff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff7b72" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="typing">
      <rect x="186" y="80" width="0" height="70">
        <animate attributeName="width" calcMode="discrete" values="0;26.4;52.8;79.2;105.6;132;158.4;184.8;211.2;237.6;264;290.4;316.8;343.2;369.6;396;422.4;448.8;475.2;501.6;528" keyTimes="0;0.05;0.1;0.15;0.2;0.25;0.3;0.35;0.4;0.45;0.5;0.55;0.6;0.65;0.7;0.75;0.8;0.85;0.9;0.95;1" begin="0.4s" dur="2.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="track">
      <rect x="300" y="318" width="300" height="4" rx="2"/>
    </clipPath>
  </defs>

  <rect width="900" height="400" rx="16" fill="url(#bg)"/>
  <rect width="900" height="400" rx="16" fill="url(#grid)"/>
  <rect width="900" height="400" rx="16" fill="url(#aura)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Line 1: typewriter -->
  <g clip-path="url(#typing)">
    <text x="186" y="130" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="44" font-weight="600" fill="#e6edf3" textLength="528" lengthAdjust="spacingAndGlyphs">Something is coming.</text>
  </g>
  <rect x="186" y="92" width="3" height="46" fill="#58a6ff">
    <animate attributeName="x" calcMode="discrete" values="186;212.4;238.8;265.2;291.6;318;344.4;370.8;397.2;423.6;450;476.4;502.8;529.2;555.6;582;608.4;634.8;661.2;687.6;714" keyTimes="0;0.05;0.1;0.15;0.2;0.25;0.3;0.35;0.4;0.45;0.5;0.55;0.6;0.65;0.7;0.75;0.8;0.85;0.9;0.95;1" begin="0.4s" dur="2.2s" fill="freeze"/>
    <animate attributeName="opacity" calcMode="discrete" values="1;0;1" keyTimes="0;0.5;1" begin="2.6s" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Line 2: BIG -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.6s" fill="freeze"/>
    <text x="450" y="252" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="120" font-weight="900" fill="#bc8cff" filter="url(#glow)" textLength="300" lengthAdjust="spacingAndGlyphs">
      BIG.
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="252" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="120" font-weight="900" fill="url(#big)" textLength="300" lengthAdjust="spacingAndGlyphs">BIG.</text>
    <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" begin="3s" dur="0.6s" fill="freeze"/>
  </g>

  <!-- Line 3: still Cooking... -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.6s" fill="freeze"/>
    <text x="319" y="295" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="28" fill="#8b949e" textLength="218" lengthAdjust="spacingAndGlyphs">still Cooking</text>
    <circle cx="551" cy="288" r="3.5" fill="#ff7b72"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="565" cy="288" r="3.5" fill="#ff7b72"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="0.25s" repeatCount="indefinite"/></circle>
    <circle cx="579" cy="288" r="3.5" fill="#ff7b72"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Progress shimmer -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.6s" fill="freeze"/>
    <rect x="300" y="318" width="300" height="4" rx="2" fill="#21262d"/>
    <g clip-path="url(#track)">
      <rect x="300" y="318" width="110" height="4" fill="url(#shine)">
        <animate attributeName="x" values="190;600" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Line 4: brand -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.8s" fill="freeze"/>
    <text x="450" y="364" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="6" fill="#58a6ff" textLength="330" lengthAdjust="spacing">NURICHTER WORKSPACE</text>
  </g>
</svg>
