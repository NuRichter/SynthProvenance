<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>$title</title>
<style>
:root{--bg:#0E1318;--panel:#141B22;--line:#243140;--text:#D5DEE7;--muted:#7D8C9B;--cyan:#4CC3D9;--ok:#46B37B;--warn:#D9A441;--bad:#E0605A}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif;margin:0;padding:32px}
main{max-width:1100px;margin:0 auto}
header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
.brand{color:var(--muted);letter-spacing:.14em;font-size:11px;text-transform:uppercase}
h1{font-weight:600;margin:6px 0 2px}h2{font-size:16px;color:var(--cyan);border-top:1px solid var(--line);padding-top:18px;margin-top:28px}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;word-break:break-word}
th{background:var(--panel);color:var(--muted);font-weight:600}
td.k{width:28%;color:var(--muted)}
code,.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px}
.muted{color:var(--muted)}footer{margin-top:40px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:12px}
</style></head><body><main>
<header><div class="brand">INSiYDE INNOVATIONS &middot; NuRichter Workspace &middot; Faculty of Computer Science</div>
<h1>$title</h1><div class="muted">$subtitle</div></header>
$content
<footer>SynthProvenance &middot; Scientific AI Content Signal &amp; Image Provenance Laboratory &middot; Insyide Innovations &times; NuRichter Workspace &middot; LOCAL RESEARCH ENVIRONMENT<br>WE DO NOT GUESS. WE MEASURE.</footer>
</main></body></html>
